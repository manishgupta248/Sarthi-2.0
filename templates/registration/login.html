{% load static %}<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Sarthi</title>
<script>(function(){var t=null;try{t=localStorage.getItem('sarthi-theme');}catch(e){}if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-bs-theme',t);})();</script>
<link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}">
</head>
<body class="bg-body-tertiary">
<div class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card shadow-sm" style="width:100%;max-width:400px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="fs-1 text-primary"><i class="bi bi-compass"></i></div>
        <h1 class="h4 mb-0">Sarthi</h1>
        <div class="text-secondary small">Sign in to continue</div>
      </div>
      {% if form.errors %}<div class="alert alert-danger py-2">Wrong username or password.</div>{% endif %}
      <form method="post">{% csrf_token %}
        <div class="mb-3"><label class="form-label" for="id_username">Username</label>
          <input class="form-control" type="text" name="username" id="id_username" autofocus autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label" for="id_password">Password</label>
          <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
