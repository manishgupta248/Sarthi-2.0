{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ heading }}</h1>
<div class="card sarthi-stat" style="max-width:720px;"><div class="card-body">
  {% if help_url %}<p class="small"><a href="{{ help_url }}">{{ help_text }}</a></p>{% endif %}
  <form method="post">{% csrf_token %}
    {% include "core/_form.html" %}
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn btn-outline-secondary" href="{{ back_url }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
